plugins {
    id 'com.gtnewhorizons.retrofuturagradle'
}

base {
    archivesName = rootProject.archives_base_name + '-forge-1.12.2'
}

java {
    // Don't force a Java 8 toolchain here.
    // We still *target* Java 8 bytecode via the shared per-project `java_release=8`
    // setting (see root build.gradle), but compiling with a newer JDK avoids the
    // Java 8 javac limitation where `--release` is an invalid flag.
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    // RFG adds LWJGL to client launches separately; reflection-based renderer tests need its vector types too.
    testRuntimeOnly('org.lwjgl.lwjgl:lwjgl_util:2.9.4-nightly-20150209') { transitive = false }
    // Reuse shared, loader-agnostic logic (config/tracking) without pulling in Loom/Minecraft deps.
    implementation(project(path: ':common', configuration: 'namedElements')) {
        transitive = false
    }
}

// The production legacy JAR must contain the same Java 8 core as the development classpath.
jar {
    from(project(':common').sourceSets.main.output) {
        exclude 'assets/**'
    }
}

sourcesJar {
    from(project(':common').sourceSets.main.allJava)
}

minecraft {
    mcVersion.set('1.12.2')

    // Used by the injected Tags class (generated by the injectTags task).
    injectedTags.put('TAG_VERSION', project.version)
}

tasks.injectTags.configure {
    outputClassName.set('dev.footstepstrail.Tags')
}

def resourceVersion = project.version
processResources {
    inputs.property 'version', project.version

    // Expand the mcmod.info version placeholder.
    filesMatching('mcmod.info') {
        expand 'modVersion': resourceVersion
    }

    // Pull the icon from the common module so we don't duplicate the binary.
    from(project(':common').sourceSets.main.resources) {
        include 'assets/footstepstrail/icon.png'
    }
}

// compilePatchedMcJava recompiles decompiled vanilla Minecraft/Forge sources. Their deprecation and
// unchecked notes are not ours to fix, so keep them out of the build output.
tasks.named('compilePatchedMcJava', JavaCompile).configure {
    options.compilerArgs.add('-XDsuppressNotes')
}
