plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.148'
}

group = rootProject.group
version = rootProject.version

base {
    archivesName = rootProject.archives_base_name + '-neoforge-latest'
}

// Merge common sources into this project's compilation so that all
// classes (common + neoforge-specific) end up in a single classes
// directory. This avoids the JPMS split-package problem.
sourceSets {
    main {
        java {
            srcDir project(':common').sourceSets.main.java
            srcDir rootProject.file('modern/src/main/java')
        }
        resources {
            srcDir project(':common').sourceSets.main.resources
            srcDir rootProject.file('modern/src/main/resources')
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation" << "-Xlint:unchecked"
}

neoForge {
    version = '26.3.0.38-beta'

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        footstepstrail {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://maven.caffeinemc.net/releases' } }
        filter { includeGroup 'net.caffeinemc' }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.code.gson:gson:2.12.1'
    // Optional: terrain footprints inside Sodium's chunk builder. Not bundled, not required.
    compileOnly "net.caffeinemc:sodium-neoforge-mod:${project.sodium_version}"
    // Hook tests read the classes the Sodium mixin targets.
    testImplementation "net.caffeinemc:sodium-neoforge-mod:${project.sodium_version}"
    testImplementation 'org.ow2.asm:asm-tree:9.8'
}

sourceSets.test.java.srcDir rootProject.file('modern/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.withType(Test).configureEach { useJUnit() }

processResources {
    var modVersion = project.version.toString()
    var mcVersion = '26.3'
    inputs.property 'version', modVersion
    inputs.property 'minecraft_version', mcVersion

    filesMatching('META-INF/neoforge.mods.toml') {
        expand(
                'version': modVersion,
                'minecraft_version': mcVersion
        )
    }
}
