pluginManagement {
    plugins {
        id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    }
    repositories {
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        maven {
            name = 'Forge'
            url = 'https://maven.minecraftforge.net/'
        }
        maven {
            name = 'Architectury'
            url = 'https://maven.architectury.dev/'
        }
        maven {
            name = 'GTNH'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention'
}

rootProject.name = 'footsteps-trail'

include('common')
include('fabric')
include('fabric_latest')
include('fabric_1_21_1')
include('forge')
include('neoforge_latest')
include('neoforge_1_21_1')
include('forge_1_12_2')

